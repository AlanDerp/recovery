    privileged: false
    apis:
    - R1LiteControlApi
    task_only_prompt: Pick up one tennis ball and place it into the cardboard box.
    prompt: |
      You are controlling a real Galaxea/Xinghaitu R1 Lite right arm.
      Pick up one tennis ball and place it into the cardboard box.

      Follow the original Cap-X sequence:
      1. Observe the box before moving and compute the release position.
      2. Call plan_tennis_graspnet(camera="head"). It selects GraspNet scores.argmax().
      3. Move directly to the returned pregrasp pose, then directly to the grasp pose.
      4. Close the gripper and lift vertically.
      5. Move above the box, move directly to the release pose, and open the gripper.
      6. Retract upward and verify the result.

      Reuse the selected grasp quaternion until release. Pick exactly one tennis ball.
      Output only one complete executable Python program with no Markdown fences.
    multi_turn_prompt: 'The following code blocks were just executed:

      ```python

      {executed_code}

      ```

      The current console stdout is:

      ```

      {console_stdout}

      ```

      The current console stderr is:

      ```

      {console_stderr}

      ```

      If stderr is non-empty or execution failed, you MUST analyze the traceback and
      respond with REGENERATE plus a complete corrected Python program.

      Important real-robot state note: a failed execution may physically move the
      tennis ball, box, or arm. Any previous object coordinates or grasp quaternion
      may now be wrong. In regenerated code, start from the current scene: open the
      gripper if safe, re-perceive the cardboard box, recompute drop_pos, call get_object_pose("tennis
      ball") again, and then plan from the current robot/object state.

      Common R1 Lite failures to fix:

      - RuntimeError from get_object_pose -> SAM3 or head-plane calibration missing;
      save_head_rgb and print the reason

      - moca_adapter unavailable -> do not bypass goto_pose; report the error and
      stop safely

      - Workspace bounds errors -> choose a smaller safe_z or re-perceive objects
      before moving

      - Gripper too tight/loose -> keep open_gripper at 14.5 and close_gripper at
      5.5 unless stderr suggests otherwise

      If execution succeeded with empty stderr and verify_tennis_in_box() reports
      success, respond FINISH.

      Please respond with EXACTLY ONE of the following:

      - The word ''REGENERATE'' followed immediately by new Python code in a fenced
      code block (```python...```) if you want to modify the code. Inside the fence,
      include only executable Python, with no prose.

      - The word ''FINISH'' if the task appears complete and stderr is empty

      '
    oracle_code: |
      import time

      import numpy as np


      obs = get_observation()

      print("Initial observation:", obs)

      saved_head = save_head_rgb("outputs/r1lite/tennis_task_head_left_rgb.png")

      saved_stereo = save_head_stereo_rgb("outputs/r1lite/tennis_task_head_stereo_left_rgb.png")

      print("Saved head RGB:", saved_head, "Saved stereo RGB:", saved_stereo)


      def recover_to_initial(attempt, reason):
          print("Grasp attempt", attempt, "failed:", reason)
          open_gripper()
          home_result = return_home()
          print("Returned to initial position:", home_result)
          time.sleep(1.0)


      open_gripper()

      box_pos, _ = get_object_pose("cardboard box")

      drop_pos = box_pos + np.array([0.0, 0.0, 0.10])

      print("box_pos:", box_pos, "drop_pos:", drop_pos)

      initial_ball_pos, _ = get_object_pose("tennis ball")

      print("INITIAL_TENNIS_POSITION_BASE:", initial_ball_pos.tolist())


      grasp_plan = None

      grasp_pos = None

      grasp_quat = None

      grasp_verified = False

      grasp_failure = None

      for attempt in range(1, 3):
          try:
              print("Starting fresh head localization and IK planning for attempt", attempt)

              grasp_plan = plan_tennis_graspnet(
                  camera="head",
                  confirm_head=True,
                  save_debug=True,
              )

              selected = grasp_plan["selected"]

              grasp_pos = np.asarray(selected["grasp_position"], dtype=float)

              pre_grasp_pos = np.asarray(selected["pregrasp_position"], dtype=float)

              grasp_quat = np.asarray(selected["grasp_quaternion_xyzw"], dtype=float)

              print("graspnet selected:", {
                  "attempt": attempt,
                  "camera": grasp_plan.get("camera"),
                  "frame_id": grasp_plan.get("frame_id"),
                  "score": selected.get("score"),
                  "selection_policy": grasp_plan.get("selection_policy"),
                  "grasp_pos": grasp_pos.tolist(),
                  "pre_grasp_pos": pre_grasp_pos.tolist(),
              })

              goto_pose(pre_grasp_pos, grasp_quat, gripper=100.0)

              goto_pose(grasp_pos, grasp_quat, gripper=100.0)

              close_gripper()

              time.sleep(1.0)

              grasp_verified, grasp_details = verify_grasp(save_debug=True)

              print("verify_grasp:", grasp_verified, grasp_details)
              if not grasp_verified:
                  print("Grasp verification failed; continuing the full place trajectory")
              break
          except Exception as exc:
              grasp_failure = repr(exc)
              recover_to_initial(attempt, grasp_failure)
              if attempt == 2:
                  raise RuntimeError("Grasp failed after one retry: " + grasp_failure)


      if grasp_pos is None or grasp_quat is None:
          raise RuntimeError("No executable grasp pose was produced: " + repr(grasp_failure))


      lift_pos = grasp_pos + np.array([0.0, 0.0, 0.18])

      goto_pose(lift_pos, grasp_quat, gripper=0.0)

      safe_z = max(lift_pos[2], drop_pos[2] + 0.12)

      goto_pose(np.array([lift_pos[0], lift_pos[1], safe_z]), grasp_quat, gripper=0.0)

      goto_pose(np.array([drop_pos[0], drop_pos[1], safe_z]), grasp_quat, gripper=0.0)


      pre_drop_pos = drop_pos + np.array([0.0, 0.0, 0.10])

      goto_pose(pre_drop_pos, grasp_quat, gripper=0.0)

      goto_pose(drop_pos, grasp_quat, gripper=0.0)

      open_gripper()

      time.sleep(0.5)

      goto_pose(drop_pos + np.array([0.0, 0.0, 0.10]), grasp_quat)


      success, details = verify_tennis_in_box()

      print("verify_tennis_in_box:", success, details)

      RESULT = {"success": success, "details": details, "grasp_plan": grasp_plan}

