    privileged: false
    apis:
    - R1LiteControlApi
    task_only_prompt: Pick up one tennis ball and place it into the cardboard box.
    prompt: "You are controlling a real Galaxea/Xinghaitu R1 Lite right arm.\nGoal:\
      \ pick up one tennis ball and place it into the cardboard box.\nImport numpy\
      \ as np and time.\n\nVision:\n- get_head_rgb(\"left\") is the Cap-X primary\
      \ scene image.\n- save_head_rgb(path) saves the head-left image for debugging.\n\
      - locate_object_head(name) uses SAM3 on the head-left camera.\n- get_object_pose(name)\
      \ maps a detected object to base_link using\n  outputs/r1lite/head_plane_calibration.json.\n\
      \nMotion:\n- open_gripper() publishes the vendor R1 target 100.\n- close_gripper()\
      \ publishes the vendor R1 target 0.\n- goto_pose(position, quaternion_xyzw,\
      \ gripper=None, hold_sec=1.2)\n  publishes interpolated right-arm end-effector\
      \ targets through moca_adapter.\n- descend_z_in_steps(target_position, quaternion_xyzw,\
      \ num_steps=10, gripper=None)\n  descends vertically while keeping XY fixed.\n\
      - move_joints_safe() remains available for small joint-space recovery moves.\n\
      \nPhase 0 - perceive the box BEFORE moving:\n- Call open_gripper() first.\n\
      - Call box_pos, grasp_quat = get_object_pose(\"cardboard box\") immediately.\n\
      - Compute drop_pos = box_pos + np.array([0.0, 0.0, 0.10])\n- Do NOT call get_object_pose(\"\
      cardboard box\") again during the task.\n\nPick-and-place sequence:\n1. grasp_pos,\
      \ grasp_quat = get_object_pose(\"tennis ball\")\n2. pre_grasp_pos = grasp_pos\
      \ + np.array([0.0, 0.0, 0.12])\n3. goto_pose(pre_grasp_pos, grasp_quat, gripper=14.5)\n\
      4. descend_z_in_steps(grasp_pos, grasp_quat, num_steps=10, gripper=14.5)\n5.\
      \ close_gripper(), then time.sleep(1.0)\n6. lift_pos = grasp_pos + np.array([0.0,\
      \ 0.0, 0.18]); goto_pose(lift_pos, grasp_quat, gripper=5.5)\n7. safe_z = max(lift_pos[2],\
      \ drop_pos[2] + 0.12)\n8. goto_pose(np.array([lift_pos[0], lift_pos[1], safe_z]),\
      \ grasp_quat, gripper=5.5)\n9. goto_pose(np.array([drop_pos[0], drop_pos[1],\
      \ safe_z]), grasp_quat, gripper=5.5)\n10. pre_drop_pos = drop_pos + np.array([0.0,\
      \ 0.0, 0.10]); goto_pose(pre_drop_pos, grasp_quat, gripper=5.5)\n11. descend_z_in_steps(drop_pos,\
      \ grasp_quat, start_z=pre_drop_pos[2], num_steps=10, gripper=5.5)\n12. open_gripper(),\
      \ time.sleep(0.5)\n13. Retreat: goto_pose(drop_pos + np.array([0.0, 0.0, 0.15]),\
      \ grasp_quat)\n14. success, details = verify_tennis_in_box(); print(details)\n\
      \nRules:\n- Pick and place exactly one tennis ball total.\n- Do NOT loop over\
      \ multiple objects.\n- NEVER move diagonally from lift_pos directly to pre_drop_pos\
      \ in one goto_pose.\n- NEVER change X and Y while descending.\n- NEVER call\
      \ get_object_pose after the task has started moving.\n- Keep grasp_quat from\
      \ the first tennis-ball detection until release.\n- Use gripper=5.5 on every\
      \ goto_pose while carrying the tennis ball.\n\nWrite one complete executable\
      \ Python program for this task.\nOutput ONLY executable Python. Do not include\
      \ Markdown fences.\nThe functions below are already imported to the environment.\n"
    multi_turn_prompt: 'The following code blocks were just executed:

      ```python

      {executed_code}

      ```

      The current console stdout is:

      ```

      {console_stdout}

      ```

      The current console stderr is:

      ```

      {console_stderr}

      ```

      If stderr is non-empty or execution failed, you MUST analyze the traceback and
      respond with REGENERATE plus a complete corrected Python program.

      Important real-robot state note: a failed execution may physically move the
      tennis ball, box, or arm. Any previous object coordinates or grasp quaternion
      may now be wrong. In regenerated code, start from the current scene: open the
      gripper if safe, re-perceive the cardboard box, recompute drop_pos, call get_object_pose("tennis
      ball") again, and then plan from the current robot/object state.

      Common R1 Lite failures to fix:

      - RuntimeError from get_object_pose -> SAM3 or head-plane calibration missing;
      save_head_rgb and print the reason

      - moca_adapter unavailable -> do not bypass goto_pose; report the error and
      stop safely

      - Workspace bounds errors -> choose a smaller safe_z or re-perceive objects
      before moving

      - Gripper too tight/loose -> keep open_gripper at 14.5 and close_gripper at
      5.5 unless stderr suggests otherwise

      If execution succeeded with empty stderr and verify_tennis_in_box() reports
      success, respond FINISH.

      Please respond with EXACTLY ONE of the following:

      - The word ''REGENERATE'' followed immediately by new Python code in a fenced
      code block (```python...```) if you want to modify the code. Inside the fence,
      include only executable Python, with no prose.

      - The word ''FINISH'' if the task appears complete and stderr is empty

      '
    oracle_code: 'import time

      import numpy as np


      obs = get_observation()

      print("Initial observation:", obs)

      saved_head = save_head_rgb("outputs/r1lite/tennis_task_head_left_rgb.png")

      print("Saved head RGB:", saved_head)


      open_gripper()

      box_pos, grasp_quat = get_object_pose("cardboard box")

      drop_pos = box_pos + np.array([0.0, 0.0, 0.10])

      print("box_pos:", box_pos, "drop_pos:", drop_pos)


      grasp_pos, grasp_quat = get_object_pose("tennis ball")

      pre_grasp_pos = grasp_pos + np.array([0.0, 0.0, 0.12])

      print("grasp_pos:", grasp_pos, "pre_grasp_pos:", pre_grasp_pos)


      goto_pose(pre_grasp_pos, grasp_quat, gripper=100.0)

      descend_z_in_steps(grasp_pos, grasp_quat, num_steps=10, gripper=100.0)

      close_gripper()

      time.sleep(1.0)


      lift_pos = grasp_pos + np.array([0.0, 0.0, 0.18])

      goto_pose(lift_pos, grasp_quat, gripper=0.0)

      safe_z = max(lift_pos[2], drop_pos[2] + 0.12)

      goto_pose(np.array([lift_pos[0], lift_pos[1], safe_z]), grasp_quat, gripper=0.0)

      goto_pose(np.array([drop_pos[0], drop_pos[1], safe_z]), grasp_quat, gripper=0.0)


      pre_drop_pos = drop_pos + np.array([0.0, 0.0, 0.10])

      goto_pose(pre_drop_pos, grasp_quat, gripper=0.0)

      descend_z_in_steps(drop_pos, grasp_quat, start_z=pre_drop_pos[2], num_steps=10,
      gripper=0.0)

      open_gripper()

      time.sleep(0.5)

      goto_pose(drop_pos + np.array([0.0, 0.0, 0.10]), grasp_quat)


      success, details = verify_tennis_in_box()

      print("verify_tennis_in_box:", success, details)

      RESULT = {"success": success, "details": details}

      '
